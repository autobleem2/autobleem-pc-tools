# autobleem-pc-tools CI: cross-compile the Win32 tools (UCRT) against the autobleem-core submodule on a
# Linux runner in the shared image, using its llvm-mingw toolchain (/opt/win-llvm.cmake) - much faster than
# a windows-latest + setup-msys2 runner. Gated by AB_CI_ENABLED.
name: build
on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure (llvm-mingw UCRT cross)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=/opt/win-llvm.cmake
      - name: Build
        run: cmake --build build

  test:
    # the tools' SDL-free cores (UpdateRoms' scan, the two installer jobs) are portable C++; their suites run
    # natively here - the Windows build above cross-compiles and cannot run them
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure (native)
        run: cmake -S . -B build_test -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build_test --target test_updateroms_core test_lastresort_core test_lanshare_core
      - name: Test
        run: ctest --test-dir build_test --output-on-failure -j4

  plan:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "version=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

  package:
    # the five Win32 programs as Release builds, stripped (never UPX-packed: Defender quarantines a packed,
    # unsigned exe as Trojan:Win32/Wacatac.C!ml - the unpacked one scans clean), in one artifact laid out as the
    # folders they ship in: AutoBleemInstaller/ and UpdateRoms/ (exe + README.txt - what the site's
    # AutoBleemInstaller-<v>.zip and UpdateRoms-<v>.zip hold; autobleem-appliance's assemble-psc.sh makes
    # both from this), AutoBleemWinSetup/ (the Windows product's setup helper, for its assembler),
    # AutoBleemFlasher/ (the PC stick flasher - AutoBleemFlasher-<v>.zip, assemble.sh's pcusb platform) and
    # LastResortRecovery/ (exe + README.txt + Google's platform-tools/, pinned - assemble-psc.sh puts it inside
    # AutoBleemInstaller-<v>.zip).
    if: vars.AB_CI_ENABLED == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash   # a container job's default is sh, which has no pipefail
    container:
      image: ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure (Release, llvm-mingw UCRT cross)
        run: cmake -S . -B build_rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/opt/win-llvm.cmake
      - name: Build
        run: cmake --build build_rel --target installer winsetup updateroms flasher lastresort lanshare
      - name: Package
        run: |
          set -euo pipefail
          V="${{ needs.plan.outputs.version }}"
          STRIP=""
          for s in llvm-strip x86_64-w64-mingw32-strip; do command -v "$s" >/dev/null && { STRIP="$s"; break; }; done
          [ -n "$STRIP" ] || { echo "::error::no strip for PE files in the image"; exit 1; }
          rm -rf stage out && mkdir -p stage/AutoBleemInstaller stage/UpdateRoms stage/AutoBleemWinSetup stage/AutoBleemFlasher stage/LastResortRecovery stage/LanShare out
          cp build_rel/apps/installer/AutoBleemInstaller.exe stage/AutoBleemInstaller/
          cp -a apps/installer/resources/. stage/AutoBleemInstaller/
          cp build_rel/apps/installer/AutoBleemWinSetup.exe stage/AutoBleemWinSetup/
          cp build_rel/apps/updateroms/UpdateRoms.exe stage/UpdateRoms/
          cp -a apps/updateroms/resources/. stage/UpdateRoms/
          cp build_rel/apps/flasher/AutoBleemFlasher.exe stage/AutoBleemFlasher/
          cp -a apps/flasher/resources/. stage/AutoBleemFlasher/
          cp build_rel/apps/lastresort/LastResortRecovery.exe stage/LastResortRecovery/
          cp -a apps/lastresort/resources/. stage/LastResortRecovery/
          cp build_rel/apps/lanshare/LanShare.exe stage/LanShare/
          cp -a apps/lanshare/resources/. stage/LanShare/
          # Google's fastboot client, unchanged and not stripped (only our own exes, one level down, are)
          bash tools/fetch_platform_tools.sh stage/LastResortRecovery
          for exe in stage/*/*.exe; do
            "$STRIP" "$exe"
            file "$exe"
          done
      # the staged folder, unsigned: the sign job below makes the zip from it
      - uses: actions/upload-artifact@v7
        with:
          name: pc-tools-win64-unsigned
          path: stage/
          retention-days: 7

  sign:
    # Authenticode signatures for the five exes through SignPath (.signpath/artifact-configuration.xml names
    # them; autobleem-build's signpath-sign action has the rules): a v* tag must come back signed, a develop
    # build ships unsigned when nobody approves it within the hour. Hosted runner, like every job before it -
    # SignPath signs nothing a self-hosted runner touched.
    if: vars.AB_CI_ENABLED == 'true'
    needs: [plan, package]
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: read }
    steps:
      - uses: autobleem2/autobleem-build/.github/actions/signpath-sign@develop
        with:
          enabled: ${{ vars.AB_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request' }}
          artifact: pc-tools-win64-unsigned
          path: stage
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          required: ${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Zip
        run: |
          set -euo pipefail
          mkdir -p out
          (cd stage && zip -r -9 -q "../out/pc-tools-win64-${{ needs.plan.outputs.version }}.zip" .)
          ls -l out; unzip -l out/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: pc-tools-win64
          path: out/*.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, sign]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: pc-tools-win64, path: out }
      - name: Attach to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "AutoBleem PC tools ${GITHUB_REF_NAME}" --generate-notes $prerelease out/*.zip || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" out/*.zip --clobber

  # the rolling development build: every successful build of develop replaces the assets of this repository's
  # `nightly` pre-release (autobleem-build's nightly-release action), which autobleem-appliance's nightly
  # assembly fetches the way it fetches a v* release. Never for a pull request or a tag.
  nightly:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: [plan, sign]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: pc-tools-win64, path: out }
      - uses: autobleem2/autobleem-build/.github/actions/nightly-release@develop
        with:
          files: out/*.zip
          version: ${{ needs.plan.outputs.version }}

  # LAN Share on the download site, next to abstored on the Store page's LAN server tab: its folder from the
  # signed zip, as lanshare-windows-x86_64-<v>.zip in autobleem-repo's extensions/lanshare/<version>/ (a develop
  # build as the development build, a v* tag as the release). On the self-hosted runner, where the site's tree
  # is - a sibling container over the mounted docker.sock, as autobleem-repo's page.yml publishes.
  site:
    if: vars.AB_CI_ENABLED == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    needs: [plan, sign]
    runs-on: [self-hosted, linux, x64]
    env:
      AB_REPO_DIR: /home/claude/autobleem-repo
    steps:
      - uses: actions/checkout@v7
        with:
          repository: autobleem2/autobleem-repo
          ref: develop
          path: autobleem-repo-tools
          fetch-depth: 0
      # a self-hosted runner keeps its workspace: an earlier run's zip in in/ made the unzip below match two
      # files and fail ("filename not matched", exit 11)
      - name: A clean in/
        run: rm -rf in ls
      - uses: actions/download-artifact@v8
        with: { name: pc-tools-win64, path: in }
      - name: Publish LAN Share to the download site
        run: |
          set -euo pipefail
          V="${{ needs.plan.outputs.version }}"
          V="${V#v}"
          rm -rf ls && mkdir -p ls/out
          unzip -q in/pc-tools-win64-*.zip 'LanShare/*' -d ls
          (cd ls && zip -r -9 -q "out/lanshare-windows-x86_64-$V.zip" LanShare)
          ls -l ls/out
          docker run --rm             -v "$PWD:$PWD" -w "$PWD/autobleem-repo-tools" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR"             -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'             ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}             bash tools/repo_publish.sh --local extension lanshare "$V" "$PWD"/ls/out/*.zip
